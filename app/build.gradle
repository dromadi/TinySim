plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.dromadi.tinysim'
 compileSdk 35
 defaultConfig { applicationId 'com.dromadi.tinysim'; minSdk 26; targetSdk 35; versionCode 19; versionName '0.1.0-alpha.19'; testInstrumentationRunner 'com.dromadi.tinysim.SmokeInstrumentation' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }

