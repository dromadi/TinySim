name: District renderer preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record actual district renderer and HUD
        env:
          TINYSIM_PREVIEW_SCENES: district-storm,district-push,district-restored
        run: ./gradlew --no-daemon -p tools/scene-preview run --args="$GITHUB_WORKSPACE/tools/scene-preview/frames.json"
      - name: Install preview browser
        working-directory: tools/scene-preview
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Replay renderer and capture pictogram HUD
        env:
          PREVIEW_FORMAT: jpeg
        run: node tools/scene-preview/shoot.js tools/scene-preview/frames.json docs/verification/alpha22
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TinySim-alpha22-renderer-preview
          path: docs/verification/alpha22/
          if-no-files-found: error
