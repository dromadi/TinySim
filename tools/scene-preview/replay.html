<!doctype html><html><body style="margin:0;background:#000"><div id="scene" style="position:relative;width:1200px;height:675px"><canvas id="c" width="1200" height="675"></canvas><canvas id="hud" width="1200" height="675" style="position:absolute;left:0;top:0;pointer-events:none"></canvas></div><script>
async function run(name){
  const data=window.DATA; const c=document.getElementById('c');
  const gl=c.getContext('webgl',{antialias:true,preserveDrawingBuffer:true});
  const objs={},attribs={},uniforms={};let program=null;
  // Material textures are recorded by path; decode every referenced image before replaying.
  const images={};
  for(const o of data.init.concat(data.frames[name]))if(o[0]==='texImageAsset'&&!images[o[1]]) {
    const img=new Image();img.src='file://'+o[1];await img.decode();images[o[1]]=img;
  }
  const exec=(o)=>{const [n,...a]=o;switch(n){
    case'createShader':objs[a[0]]=gl.createShader(a[1]);break;
    case'shaderSource':gl.shaderSource(objs[a[0]],a[1]);break;
    case'compileShader':gl.compileShader(objs[a[0]]);if(!gl.getShaderParameter(objs[a[0]],gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(objs[a[0]]));break;
    case'createProgram':objs[a[0]]=gl.createProgram();break;
    case'attachShader':gl.attachShader(objs[a[0]],objs[a[1]]);break;
    case'linkProgram':gl.linkProgram(objs[a[0]]);if(!gl.getProgramParameter(objs[a[0]],gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(objs[a[0]]));break;
    case'attrib':attribs[a[0]]=gl.getAttribLocation(objs[a[1]],a[2]);break;
    case'uniformLoc':uniforms[a[0]]=gl.getUniformLocation(objs[a[1]],a[2]);break;
    case'createBuffer':objs[a[0]]=gl.createBuffer();break;
    case'bindBuffer':gl.bindBuffer(gl.ARRAY_BUFFER,objs[a[0]]);break;
    case'bufferData':gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a[0]),gl.STATIC_DRAW);break;
    case'bufferSubData':gl.bufferSubData(gl.ARRAY_BUFFER,a[0],new Float32Array(a[1]));break;
    case'attribPointer':gl.vertexAttribPointer(attribs[a[0]],a[1],gl.FLOAT,false,a[2],a[3]);break;
    case'enableAttrib':gl.enableVertexAttribArray(attribs[a[0]]);break;
    case'disableAttrib':gl.disableVertexAttribArray(attribs[a[0]]);break;
    case'drawArrays':gl.drawArrays(gl.TRIANGLES,a[0],a[1]);break;
    case'enable':gl.enable(a[0]);break; case'disable':gl.disable(a[0]);break;
    case'depthFunc':gl.depthFunc(a[0]);break; case'cullFace':gl.cullFace(a[0]);break;
    case'blendFunc':gl.blendFunc(a[0],a[1]);break; case'depthMask':gl.depthMask(a[0]);break;
    case'clearColor':gl.clearColor(...a);break; case'clear':gl.clear(a[0]);break;
    case'viewport':gl.viewport(...a);break; case'scissor':gl.scissor(...a);break;
    case'useProgram':gl.useProgram(objs[a[0]]);break;
    case'm4':gl.uniformMatrix4fv(uniforms[a[0]],false,a[1]);break;
    case'm3':gl.uniformMatrix3fv(uniforms[a[0]],false,a[1]);break;
    case'u4':gl.uniform4f(uniforms[a[0]],a[1],a[2],a[3],a[4]);break;
    case'u3':gl.uniform3f(uniforms[a[0]],a[1],a[2],a[3]);break;
    case'u2':gl.uniform2f(uniforms[a[0]],a[1],a[2]);break;
    case'u1':gl.uniform1f(uniforms[a[0]],a[1]);break;
    case'u1i':gl.uniform1i(uniforms[a[0]],a[1]);break;
    case'createTexture':objs[a[0]]=gl.createTexture();break;
    case'bindTexture':gl.bindTexture(gl.TEXTURE_2D,a[0]?objs[a[0]]:null);break;
    case'texImage':gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,a[0],a[1],0,gl.RGBA,gl.UNSIGNED_BYTE,null);break;
    case'texParam':gl.texParameteri(gl.TEXTURE_2D,a[0],a[1]);break;
    case'texParamf':{const ext=gl.getExtension('EXT_texture_filter_anisotropic');if(ext)gl.texParameterf(gl.TEXTURE_2D,a[0],a[1]);break;}
    case'texImageAsset':gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,images[a[0]]);break;
    case'generateMipmap':gl.generateMipmap(gl.TEXTURE_2D);break;
    case'deleteTexture':break;
    case'createRenderbuffer':objs[a[0]]=gl.createRenderbuffer();break;
    case'bindRenderbuffer':gl.bindRenderbuffer(gl.RENDERBUFFER,objs[a[0]]);break;
    case'renderbufferStorage':gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,a[0],a[1]);break;
    case'createFramebuffer':objs[a[0]]=gl.createFramebuffer();break;
    case'bindFramebuffer':gl.bindFramebuffer(gl.FRAMEBUFFER,a[0]?objs[a[0]]:null);break;
    case'fbTexture':gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,objs[a[0]],0);break;
    case'fbRenderbuffer':gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,objs[a[0]]);break;
    case'activeTexture':gl.activeTexture(a[0]);break;
    default:throw new Error('op '+n);}};
  data.init.forEach(exec); data.frames[name].forEach(exec);
  const ctx=document.getElementById('hud').getContext('2d');
  const setPaint=(p)=>{
    const color=p[0]>>>0;
    const css=`rgba(${(color>>>16)&255},${(color>>>8)&255},${color&255},${(color>>>24)/255})`;
    ctx.fillStyle=ctx.strokeStyle=css;ctx.lineWidth=p[2];ctx.lineCap='round';ctx.lineJoin='round';
    ctx.font=`bold ${p[3]}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='alphabetic';
    return p[1]==='STROKE';
  };
  for(const [op,...a] of (data.hud?.[name]||[])) {
    if(op==='save'){ctx.save();continue;}if(op==='restore'){ctx.restore();continue;}
    if(op==='translate'){ctx.translate(...a);continue;}if(op==='scale'){ctx.scale(...a);continue;}
    if(op==='rotate'){ctx.rotate(a[0]*Math.PI/180);continue;}
    const stroke=setPaint(a[a.length-1]);ctx.beginPath();
    if(op==='roundRect')ctx.roundRect(a[0],a[1],a[2],a[3],a[4]);
    else if(op==='circle')ctx.arc(a[0],a[1],a[2],0,Math.PI*2);
    else if(op==='line'){ctx.moveTo(a[0],a[1]);ctx.lineTo(a[2],a[3]);ctx.stroke();continue;}
    else if(op==='text'){ctx.fillText(a[0],a[1],a[2]);continue;}
    else if(op==='path'){const p=a[0];ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.closePath();}
    else if(op==='arc')ctx.ellipse((a[0]+a[2])/2,(a[1]+a[3])/2,(a[2]-a[0])/2,(a[3]-a[1])/2,0,a[4]*Math.PI/180,(a[4]+a[5])*Math.PI/180);
    else throw new Error('HUD op '+op);
    if(stroke)ctx.stroke();else ctx.fill();
  }
  const e=gl.getError(); return e;
}
</script></body></html>
